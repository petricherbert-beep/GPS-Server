syntax = "proto3";

package tracking;

// 🔥 STABLE SCHEMA V344
// Core fields are FIXED and REQUIRED (no optional) at the start to ensure alignment.

message LocationUpdateProto {
  string device_id = 1;
  double lat = 2;
  double lon = 3;
  int64 timestamp = 4;
  float speed = 5;
  float bearing = 6;
  float accuracy = 7;
  int32 battery = 8;
  bool alarm_active = 9;
  bool is_watched = 10;
  bool is_locked = 11;
  string name = 12;
  string fcm_token = 13;
  string geofence_event = 14;
  string motion_state = 15;
  int32 sats = 16;
  double visual_lat = 17;
  double visual_lon = 18;
  int32 color = 19;

  // Specific to Update
  string point_id = 20;
  bool is_awake = 21;
  float temperature = 22;
  repeated double intermediate_coords = 23;
}

message DeviceLocationProto {
  string device_id = 1;
  double lat = 2;
  double lon = 3;
  int64 timestamp = 4;
  float speed = 5;
  float bearing = 6;
  float accuracy = 7;
  int32 battery = 8;
  bool alarm_active = 9;
  bool is_watched = 10;
  bool is_locked = 11;
  string name = 12;
  string fcm_token = 13;
  string geofence_event = 14;
  string motion_state = 15;
  int32 sats = 16;
  double visual_lat = 17;
  double visual_lon = 18;
  int32 color = 19;

  // Specific to Device
  bool offline = 20;
  string status = 21;
  string watcher_name = 22;
  repeated double intermediate_coords = 23;
}

message LocationBatchProto {
  repeated LocationUpdateProto updates = 1;
}

message DeviceListProto {
  repeated DeviceLocationProto devices = 1;
}

message DeviceListRequest {
  string api_key = 1;
}

message TrackingResponse {
  oneof update {
    DeviceLocationProto device = 1;
    bool reload_geofences = 2;
  }
}

message TrackingEvent {
  string device_id = 1;
  int64 timestamp = 2;
  oneof payload {
    LocationUpdateProto location_update = 3;
    TrackingResponse server_response = 4;
  }
}

service TrackingService {
  rpc TrackLocation(stream TrackingEvent) returns (stream TrackingEvent);
  rpc GetDevices(DeviceListRequest) returns (DeviceListProto);
}
