syntax = "proto3";

package tracking;

option java_package = "com.example.gpstrackingapp.proto";
option java_multiple_files = true;

// 🔥 UNIFIED SCHEMA V342 - MIRROR ALIGNMENT

message LocationUpdateProto {
  string device_id = 1;
  string name = 2;
  double lat = 3;
  double lon = 4;
  optional int32 battery = 5;
  optional float speed = 6;
  optional float bearing = 7;
  int64 timestamp = 8;
  optional float accuracy = 9;
  optional float temperature = 10;
  bool alarm_active = 11;
  bool is_watched = 12;
  string fcm_token = 13;
  bool is_locked = 14;
  bool is_motion = 15;
  bool is_wifi = 16;
  bool accident = 17;
  string geofence_event = 18;
  string motion_state = 19;
  optional int32 sats = 20;
  optional double snapped_lat = 21;
  optional double snapped_lon = 22;
  optional double visual_lat = 23;
  optional double visual_lon = 24;
  optional int32 color = 25;
  bool is_awake = 26;
  string status = 27;
  string watcher_name = 28;
  string point_id = 29;
  bool offline = 30;

  // Specific to Update
  optional int32 proximity_distance = 31;
  optional bool proximity_enabled = 32;
  repeated double intermediate_coords = 33;
}

message DeviceLocationProto {
  string device_id = 1;
  string name = 2;
  double lat = 3;
  double lon = 4;
  optional int32 battery = 5;
  optional float speed = 6;
  optional float bearing = 7;
  int64 timestamp = 8;
  optional float accuracy = 9;
  optional float temperature = 10;
  bool alarm_active = 11;
  bool is_watched = 12;
  string fcm_token = 13;
  bool is_locked = 14;
  bool is_motion = 15;
  bool is_wifi = 16;
  bool accident = 17;
  string geofence_event = 18;
  string motion_state = 19;
  optional int32 sats = 20;
  optional double snapped_lat = 21;
  optional double snapped_lon = 22;
  optional double visual_lat = 23;
  optional double visual_lon = 24;
  optional int32 color = 25;
  bool is_awake = 26;
  string status = 27;
  string watcher_name = 28;
  string point_id = 29;
  bool offline = 30;

  // Specific to Device
  repeated double intermediate_coords = 33;
}

message LocationBatchProto {
  repeated LocationUpdateProto updates = 1;
}

message DeviceListProto {
  repeated DeviceLocationProto devices = 1;
}

message DeviceListRequest {
  string api_key = 1;
}

message TrackingResponse {
  oneof update {
    DeviceLocationProto device = 1;
    bool reload_geofences = 2;
  }
}

message TrackingEvent {
  string device_id = 1;
  int64 timestamp = 2;
  oneof payload {
    LocationUpdateProto location_update = 3;
    TrackingResponse server_response = 4;
  }
}

service TrackingService {
  rpc TrackLocation(stream TrackingEvent) returns (stream TrackingEvent);
  rpc GetDevices(DeviceListRequest) returns (DeviceListProto);
}
