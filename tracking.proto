syntax = "proto3";

option java_package = "com.example.gpstrackingapp.proto";
option java_multiple_files = true;

package tracking;

message LocationUpdateProto {
  string point_id = 1;
  string device_id = 2;
  string name = 3;
  double lat = 4;
  double lon = 5;
  int32 battery = 6;
  float temperature = 7;
  float speed = 8;
  float bearing = 9;
  int64 timestamp = 10;
  float accuracy = 11;
  bool alarm_active = 12;
  bool is_awake = 13;
  bool is_watched = 14;
  string fcm_token = 15;
  string geofence_event = 16;
  bool is_locked = 17;
  bool is_motion = 18;
  bool is_wifi = 19;
  bool accident = 20;
  int32 proximity_distance = 21;
  bool proximity_enabled = 22;
  double snapped_lat = 23;
  double snapped_lon = 24;
  double visual_lat = 25;
  double visual_lon = 26;
  string motion_state = 27;
}

message LocationBatchProto {
  repeated LocationUpdateProto updates = 1;
}

message DeviceLocationProto {
  string device_id = 1;
  double lat = 2;
  double lon = 3;
  int32 battery = 4;
  float temperature = 5;
  float speed = 6;
  float bearing = 7;
  int64 timestamp = 8;
  float accuracy = 9;
  bool offline = 10;
  string name = 11;
  string status = 12;
  bool alarm_active = 13;
  bool is_awake = 14;
  bool is_watched = 15;
  string watcher_name = 16;
  string fcm_token = 17;
  bool is_locked = 18;
  bool is_motion = 19;
  bool is_wifi = 20;
  bool accident = 21;
  double snapped_lat = 22;
  double snapped_lon = 23;
  double visual_lat = 26;
  double visual_lon = 27;
  string geofence_event = 24;
  string motion_state = 25;
}

message DeviceListProto {
  repeated DeviceLocationProto devices = 1;
}

message DeviceListRequest {
  string api_key = 1;
}

service TrackingService {
  rpc TrackLocation(stream LocationUpdateProto) returns (stream TrackingResponse);
  rpc GetDevices(DeviceListRequest) returns (DeviceListProto);
}

message TrackingResponse {
  oneof update {
    DeviceLocationProto device = 1;
    bool reload_geofences = 2;
  }
}
