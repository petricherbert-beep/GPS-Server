syntax = "proto3";

package tracking;

option java_package = "com.example.gpstrackingapp.proto";
option java_multiple_files = true;

// 🔥 MASTER SCHEMA V357 - FULL OPTIONAL SUPPORT

message LocationUpdateProto {
  string device_id = 1;
  string name = 2;
  double lat = 3;
  double lon = 4;
  optional int32 battery = 5;
  bool alarm_active = 6;
  bool is_locked = 7;
  optional float speed = 8;
  optional float bearing = 9;
  int64 timestamp = 10;
  optional float accuracy = 11;
  bool is_watched = 12;
  string fcm_token = 13;
  string geofence_event = 14;
  string motion_state = 15;
  optional int32 sats = 16;
  optional double visual_lat = 17;
  optional double visual_lon = 18;
  optional int32 color = 19;
  bool offline = 20;
  string status = 21;
  string watcher_name = 22;
  bool is_awake = 23;
  optional float temperature = 24;
  string point_id = 25;
  repeated double intermediate_coords = 26;
}

message DeviceLocationProto {
  string device_id = 1;
  string name = 2;
  double lat = 3;
  double lon = 4;
  optional int32 battery = 5;
  bool alarm_active = 6;
  bool is_locked = 7;
  optional float speed = 8;
  optional float bearing = 9;
  int64 timestamp = 10;
  optional float accuracy = 11;
  bool is_watched = 12;
  string fcm_token = 13;
  string geofence_event = 14;
  string motion_state = 15;
  optional int32 sats = 16;
  optional double visual_lat = 17;
  optional double visual_lon = 18;
  optional int32 color = 19;
  bool offline = 20;
  string status = 21;
  string watcher_name = 22;
  bool is_awake = 23;
  optional float temperature = 24;
  string point_id = 25;
  repeated double intermediate_coords = 26;
}

message LocationBatchProto {
  repeated LocationUpdateProto updates = 1;
}

message DeviceListProto {
  repeated DeviceLocationProto devices = 1;
}

message DeviceListRequest {
  string api_key = 1;
}

message TrackingResponse {
  oneof update {
    DeviceLocationProto device = 1;
    bool reload_geofences = 2;
  }
}

message TrackingEvent {
  string device_id = 1;
  int64 timestamp = 2;
  oneof payload {
    LocationUpdateProto location_update = 3;
    TrackingResponse server_response = 4;
  }
}

service TrackingService {
  rpc TrackLocation(stream TrackingEvent) returns (stream TrackingEvent);
  rpc GetDevices(DeviceListRequest) returns (DeviceListProto);
}
