syntax = "proto3";

package tracking;

// 🔥 MIRROR SCHEMA V352 - TOTAL ALIGNMENT
// Shared fields MUST use identical indices.

message LocationUpdateProto {
  string device_id = 1;
  string name = 2;
  double lat = 3;
  double lon = 4;
  int32 battery = 5;
  bool alarm_active = 6;
  bool is_locked = 7;
  float speed = 8;
  float bearing = 9;
  int64 timestamp = 10;
  float accuracy = 11;
  bool is_watched = 12;
  string fcm_token = 13;
  string geofence_event = 14;
  string motion_state = 15;
  int32 sats = 16;
  double visual_lat = 17;
  double visual_lon = 18;
  int32 color = 19;
  string point_id = 20;
  bool is_awake = 21;
  float temperature = 22;
  double snapped_lat = 23;
  double snapped_lon = 24;
  string watcher_name = 25;
  bool offline = 26;
  string status = 27;
  repeated double intermediate_coords = 28;
}

message DeviceLocationProto {
  string device_id = 1;
  string name = 2;
  double lat = 3;
  double lon = 4;
  int32 battery = 5;
  bool alarm_active = 6;
  bool is_locked = 7;
  float speed = 8;
  float bearing = 9;
  int64 timestamp = 10;
  float accuracy = 11;
  bool is_watched = 12;
  string fcm_token = 13;
  string geofence_event = 14;
  string motion_state = 15;
  int32 sats = 16;
  double visual_lat = 17;
  double visual_lon = 18;
  int32 color = 19;
  string point_id = 20;
  bool is_awake = 21;
  float temperature = 22;
  double snapped_lat = 23;
  double snapped_lon = 24;
  string watcher_name = 25;
  bool offline = 26;
  string status = 27;
  repeated double intermediate_coords = 28;
}

message LocationBatchProto {
  repeated LocationUpdateProto updates = 1;
}

message DeviceListProto {
  repeated DeviceLocationProto devices = 1;
}

message DeviceListRequest {
  string api_key = 1;
}

message TrackingResponse {
  oneof update {
    DeviceLocationProto device = 1;
    bool reload_geofences = 2;
  }
}

message TrackingEvent {
  string device_id = 1;
  int64 timestamp = 2;
  oneof payload {
    LocationUpdateProto location_update = 3;
    TrackingResponse server_response = 4;
  }
}

service TrackingService {
  rpc TrackLocation(stream TrackingEvent) returns (stream TrackingEvent);
  rpc GetDevices(DeviceListRequest) returns (DeviceListProto);
}
