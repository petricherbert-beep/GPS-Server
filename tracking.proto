syntax = "proto3";

package tracking;

import "google/protobuf/wrappers.proto";

// --- ENUMS ---

enum MotionState {
  MOTION_UNKNOWN = 0;
  STILL = 1;
  WALKING = 2;
  CYCLING = 3;
  DRIVING = 4;
  HIGHWAY = 5;
}

enum GeofenceTransition {
  GEOFENCE_NONE = 0;
  ENTER = 1;
  EXIT = 2;
}

// --- SHARED COMPONENTS ---

message LocationCore {
  double lat = 1;
  double lon = 2;
  int64 timestamp = 3;
  google.protobuf.FloatValue speed = 4;
  google.protobuf.FloatValue bearing = 5;
  google.protobuf.FloatValue accuracy = 6;
  google.protobuf.Int32Value battery = 7;
  google.protobuf.FloatValue temperature = 8;
  MotionState motion_state = 9;
}

message DeviceState {
  bool alarm_active = 1;
  bool is_awake = 2;
  bool is_watched = 3;
  bool is_locked = 4;
  bool is_motion = 5;
  bool is_wifi = 6;
  bool accident = 7;
}

message EncryptedPayload {
  int32 version = 1;
  bytes iv = 2;
  bytes ciphertext = 3;
  string algorithm = 4;
}

// --- MESSAGES ---

message LocationUpdateProto {
  string point_id = 1;
  string device_id = 2;
  string name = 3;
  LocationCore core = 4;
  DeviceState state = 5;
  string fcm_token = 6;

  GeofenceTransition geofence_event = 7;
  string geofence_name = 8;

  google.protobuf.Int32Value proximity_distance = 10;
  google.protobuf.BoolValue proximity_enabled = 11;

  // Snap/Visual geometry
  google.protobuf.DoubleValue snapped_lat = 12;
  google.protobuf.DoubleValue snapped_lon = 13;
  google.protobuf.DoubleValue visual_lat = 14;
  google.protobuf.DoubleValue visual_lon = 15;

  EncryptedPayload encrypted_payload = 20;
}

message LocationBatchProto {
  repeated LocationUpdateProto updates = 1;
}

message DeviceLocationProto {
  string device_id = 1;
  string name = 2;
  LocationCore core = 3;
  DeviceState state = 4;

  bool offline = 5;
  string status_msg = 6;
  string watcher_name = 7;
  string fcm_token = 8;

  GeofenceTransition geofence_event = 10;
  string geofence_name = 11;

  google.protobuf.DoubleValue snapped_lat = 12;
  google.protobuf.DoubleValue snapped_lon = 13;
  google.protobuf.DoubleValue visual_lat = 14;
  google.protobuf.DoubleValue visual_lon = 15;

  EncryptedPayload encrypted_payload = 20;
}

message DeviceListProto {
  repeated DeviceLocationProto devices = 1;
  string next_page_token = 2;
}

message DeviceListRequest {
  string api_key = 1;
  int32 page_size = 2;
  string page_token = 3;
}

message TrackingResponse {
  oneof update {
    DeviceLocationProto device = 1;
    bool reload_geofences = 2;
    string server_command = 3;
  }
}

// --- ENVELOPE FOR STREAMING ---

message TrackingEvent {
  string device_id = 1;
  int64 timestamp = 2;

  oneof payload {
    LocationUpdateProto location_update = 3;
    TrackingResponse server_response = 4;
    string heartbeat = 5;
  }
}

// --- SERVICE ---

service TrackingService {
  // Bidirektionaler Event-Stream
  rpc TrackLocation(stream TrackingEvent) returns (stream TrackingEvent);

  // Initialer Abruf der Geräteliste
  rpc GetDevices(DeviceListRequest) returns (DeviceListProto);
}
